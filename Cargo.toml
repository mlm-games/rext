[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/rext"

[workspace.dependencies]
repose-core     = { path = "../repose/crates/repose-core",     version = "0.30" }
repose-ui       = { path = "../repose/crates/repose-ui",       version = "0.30" }
repose-material = { path = "../repose/crates/repose-material", version = "0.30" }
repose-canvas   = { path = "../repose/crates/repose-canvas",   version = "0.30" }
repose-docking  = { path = "../repose/crates/repose-docking",  version = "0.30" }
repose-platform = { path = "../repose/crates/repose-platform", version = "0.30" }
repose-text     = { path = "../repose/crates/repose-text",     version = "0.30" }
repose-app      = { path = "../repose/crates/repose-app",      version = "0.30" }

ropey = "1.6"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
smallvec = "1.15"
unicode-segmentation = "1.13"
unicode-width = "0.2"
portable-pty = "0.9"
vte = "0.15"

rext-core = { path = "crates/rext-core" }
rext-ui = { path = "crates/rext-ui" }

[profile.dev]
opt-level = 1
